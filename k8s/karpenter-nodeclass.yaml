apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: frutas-training
spec:
  role: KarpenterNodeRole-formatec-frutas-pro
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: formatec-frutas-pro
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: formatec-frutas-pro
  associatePublicIPAddress: true
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
